[package]
name = "flux-cli"
version = "0.1.0"
edition = "2021"
authors = ["Zenith <zenith@example.com>"]
description = "The command-line interface for Flux."
license = "MIT"

[[bin]]
name = "flux"
path = "src/main.rs"

[dependencies]
flux-core = { path = "../core" }
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
indicatif = "0.17"
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.14"
